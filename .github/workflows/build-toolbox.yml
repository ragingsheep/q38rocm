name: Build Q38 Toolbx

on:
  push:
    branches:
      - main
    paths:
      - "Dockerfile.toolbox"
      - "build_engine.sh"
      - "run_server.sh"
      - "setup_env.sh"
      - "requirements.txt"
      - "scripts/**"
      - ".github/workflows/build-toolbox.yml"

  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set image name
        run: |
          echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/q38rocm-toolbox" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Toolbx image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.toolbox
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.description=Q38 ROCmFPX Toolbx for AMD Strix Halo
